<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekindled Viewer</title>
<style>
  :root {
    --bg-top: #070b1f;
    --bg-bottom: #14103f;
    --text: #aab2d8;
    --text-dim: #7e86b0;
    --link: #8f9bff;
    --rule: rgba(143, 155, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  main img { width: min(640px, 86vw); height: auto; display: block; }
  footer {
    border-top: 1px solid var(--rule);
    padding: 20px 16px 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  footer a { color: var(--link); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .credits {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px 36px;
    margin-top: 14px;
  }
  .credits a { display: inline-flex; align-items: center; }
  .credits img { height: 32px; width: auto; display: block; opacity: 0.9; }
  .credits a:hover img { opacity: 1; }
  /* the Vulkan logo is dark red, so it sits on a light chip to stay legible on the dark page */
  .credits a.chip { background: #eef0ff; border-radius: 8px; padding: 6px 14px; }
  .credits a.chip img { height: 24px; opacity: 1; }
</style>
</head>
<body>
<main>
  <img src="rekindled-logo.svg" alt="Rekindled Viewer">
</main>
<footer>
  <div>Based on <a href="https://www.firestormviewer.org/" target="_blank" rel="noopener">Firestorm Viewer</a></div>
  <div class="credits">
    <a href="https://www.fmod.com/" target="_blank" rel="noopener" title="FMOD Studio by Firelight Technologies"><img src="fmod-logo.png" alt="FMOD"></a>
    <a class="chip" href="https://vulkan.org/" target="_blank" rel="noopener" title="Vulkan"><img src="vulkan-logo.svg" alt="Vulkan"></a>
  </div>
</footer>
</body>
</html>
